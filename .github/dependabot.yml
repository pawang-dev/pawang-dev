version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      render:
        patterns:
          - "three"
          - "playwright-core"
          - "opentype.js"
          - "sharp"
          - "node-webpmux"
