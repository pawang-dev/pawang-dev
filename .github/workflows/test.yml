name: Test

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - run: npm test

  render-3d:
    # Menjaga agar bump three / playwright-core tidak diam-diam merusak animasi 3D.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - name: Pasang Chromium
        run: npx playwright-core install --with-deps chromium || npx playwright-core install chromium
      - run: npm run test:3d
