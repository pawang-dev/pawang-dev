name: Update profile

on:
  schedule:
    - cron: "17 0 * * *" # sekali sehari, 07.17 WIB
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "profile.config.json"
      - "fonts/**"
      - "assets/brand/**"
      - "assets/icons/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      HAS_APP: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Buat token GitHub App
        if: env.HAS_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      # Node bawaan runner dipakai apa adanya (butuh >= 20).
      - name: Pasang dependensi
        run: npm ci --no-audit --no-fund

      # Chromium untuk render 3D (three.js + WebGL). Bila gagal, build tetap jalan:
      # animasi 3D sebelumnya dipertahankan, atau dipakai SVG 2D.
      - name: Pasang Chromium (render 3D)
        continue-on-error: true
        run: npx playwright-core install --with-deps chromium || npx playwright-core install chromium

      - name: Build
        env:
          GH_USER: ${{ github.repository_owner }}
          # Sengaja hanya GITHUB_TOKEN: data publik saja. Repo privat tidak dibaca dan tidak pernah tampil.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs

      - name: Identitas git (GitHub App)
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Identitas git (bawaan)
        if: env.HAS_APP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit dan push jika ada perubahan
        run: |
          git add -A assets README.md
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: update profile"
            git push
          fi
