name: Update profile SVG

on:
  schedule:
    - cron: "0 */12 * * *"   # tiap 12 jam
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions
  push:
    paths:
      - "scripts/*.py"
      - "social.json"
      - "assets/images/**"
      - "assets/data/**"

# GITHUB_TOKEN cukup read-only. Penulisan ke repo memakai token GitHub App di bawah.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04   # dipatok eksplisit (ubuntu-latest sedang pindah ke 26.04)
    steps:
      # Token GitHub App (hanya izin contents: write, berlaku 1 jam)
      - name: Buat token GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate SVG
        env:
          GH_USER: pawang-dev
          # Opsional: PAT dengan scope read:user supaya kontribusi privat ikut terhitung.
          # Kalau secret tidak diisi, dipakai GITHUB_TOKEN (hanya data publik).
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build.py
          python scripts/build_terminal.py
          python scripts/build_templates.py
          python scripts/build_social.py

      - name: Atur identitas git sebagai bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Commit dan push jika ada perubahan
        run: |
          git add -A assets/svg README.md
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: update profile svg"
            git push
          fi
