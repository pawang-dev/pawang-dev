name: Update profile

on:
  schedule:
    - cron: "17 0 * * *" # sekali sehari, 07.17 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile.config.json"
      - "fonts/**"
      - "brand/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    # Hanya dari main (jadwal, tombol, atau push ke main). Cabang lain, misalnya milik Dependabot,
    # tidak boleh menerbitkan aset atau meng-commit apa pun.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    env:
      HAS_APP: ${{ secrets.APP_CLIENT_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Buat token GitHub App
        if: env.HAS_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      # Hasil render (SVG, WebP) tidak disimpan di main, tetapi di branch yatim "assets".
      # Ambil isi sebelumnya supaya animasi 3D dan artikel lama bisa dipertahankan bila sumbernya gagal.
      - name: Ambil aset sebelumnya (branch assets)
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          rm -rf assets
          if git ls-remote --exit-code --heads origin assets >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch assets \
              "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" assets
            rm -rf assets/.git
          else
            mkdir -p assets
          fi

      # Node bawaan runner dipakai apa adanya (butuh >= 20).
      - name: Pasang dependensi
        run: npm ci --no-audit --no-fund

      # Chromium untuk render 3D (three.js + WebGL). Bila gagal, build tetap jalan:
      # animasi 3D sebelumnya dipertahankan, atau dipakai SVG 2D.
      - name: Pasang Chromium (render 3D)
        continue-on-error: true
        run: npx playwright-core install --with-deps chromium || npx playwright-core install chromium

      - name: Build
        env:
          GH_USER: ${{ github.repository_owner }}
          # Sengaja hanya GITHUB_TOKEN: data publik saja. Repo privat tidak dibaca dan tidak pernah tampil.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs

      - name: Identitas git (GitHub App)
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Identitas git (bawaan)
        if: env.HAS_APP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Satu commit tanpa riwayat, di-force-push ke branch "assets". main tidak ikut penuh biner.
      - name: Terbitkan aset ke branch assets
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          NAME="$(git config user.name)"
          MAIL="$(git config user.email)"
          URL="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd assets
          git init -q -b assets
          git add -A
          git -c user.name="$NAME" -c user.email="$MAIL" commit -q -m "chore: render profile assets"
          if git fetch -q --depth 1 "$URL" assets 2>/dev/null \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "Aset tidak berubah."
          else
            git push -q --force "$URL" HEAD:refs/heads/assets
            echo "Aset diterbitkan ke branch assets."
          fi

      # main hanya berubah bila README berubah (jarang).
      - name: Commit README jika berubah
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "README tidak berubah."
          else
            git commit -m "chore: update README"
            git push
          fi
